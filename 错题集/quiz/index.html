  --f-display:"Bricolage Grotesque","Noto Sans SC",system-ui,sans-serif;

  --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --surface:#1b212a; --ink:#e7ecf2; --muted:#93a0b1; --line:#2c3541;
  --accent:#7d9cff; --accent-ink:#0e1420; --good:#57c98f; --good-bg:#16302a; --bad:#f07a7a; --bad-bg:#3a1f22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1b212a; --ink:#e7ecf2; --muted:#93a0b1; --line:#2c3541;
  --accent:#7d9cff; --accent-ink:#0e1420; --good:#57c98f; --good-bg:#16302a; --bad:#f07a7a; --bad-bg:#3a1f22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.7rem;letter-spacing:-.01em;margin:0}
h1 span{color:var(--accent)}
.stats{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.tag{font-family:var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.tag.again{color:var(--bad);border-color:var(--bad)}
.q{font-size:1.1rem;font-weight:500;overflow-x:auto}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 14px;font:inherit;cursor:pointer;min-width:0;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-size:.8rem;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--bg);color:var(--muted)}
.opt .t{min-width:0;overflow-x:auto}
.opt.picked{border-color:var(--accent)}
.opt.picked .k{background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.verdict{font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.ex{border-top:1px solid var(--line);padding-top:14px;color:var(--ink)}
.ex b{display:block;font-size:.78rem;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.btn{border:0;border-radius:10px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.hint{font-size:.78rem;color:var(--muted);text-align:center}
.done{text-align:center;display:grid;gap:12px;justify-items:center}
.done .big{font-family:var(--f-display);font-weight:800;font-size:3rem;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const Q=[{"w": 1, "type": "mc", "title": "监督学习的定义", "q": "Which of the following best describes supervised learning?", "opts": ["Learning patterns from unlabeled inputs by grouping similar examples", "Learning to map inputs to outputs using labelled input-output pairs", "Memorizing the training set so that all future predictions are exact", "Choosing features without needing target outputs"], "ans": [1], "ex": "监督学习 (supervised learning) 用带标签的输入-输出对 $(\\mathbf{x}^{(i)}, t^{(i)})$ 学习映射 $f:\\mathbf{x}\\mapsto t$ 。A 是无监督学习（聚类），C 是死记硬背，不能泛化，D 不需要目标值，也不是监督学习。"}, {"w": 1, "type": "mc", "title": "哪个是分类任务", "q": "Which of the following tasks is a classification task?", "opts": ["Predicting tomorrow's highest temperature in Celsius", "Predicting a person's height from shoe size", "Predicting whether a leaf is oak or maple", "Predicting the age of a person in years from a social media message"], "ans": [2], "ex": "分类 (classification) 的输出是离散类别，回归 (regression) 的输出是连续实数。橡树/枫树是两个类别；温度、身高、年龄都是数值，属于回归。"}, {"w": 1, "type": "mc", "title": "符号 t 与 y 的区别", "q": "What is the difference between $t$ and $y$ in the standard notation?", "opts": ["$t$ is the predicted output and $y$ is the target output", "$t$ is the target output and $y$ is the predicted output", "$t$ is a feature and $y$ is a label", "$t$ is used only for regression and $y$ only for classification"], "ans": [1], "ex": "课程约定： $t$ 是目标值 (target)，即真实标签； $y$ 是模型的预测 (prediction)。损失函数比较的就是 $y$ 和 $t$ ，例如 $\\frac12(y-t)^2$ 。"}, {"w": 1, "type": "mc", "title": "假设 f 的含义", "q": "Which of the following best matches the meaning of a hypothesis f?", "opts": ["A rule or mapping that takes an input x and produces a prediction", "A dataset of labelled examples used during training", "A method for evaluating generalization on unseen data", "A collection of models that all share the same hyperparameters"], "ans": [0], "ex": "假设 (hypothesis) $f$ 是一个具体的映射 $y=f(\\mathbf{x})$ ，把输入变成预测。学习算法做的事，就是在假设空间里挑出一个好的 $f$ 。"}, {"w": 1, "type": "mc", "title": "回归还是分类由什么决定", "q": "Which quantity determines whether a supervised learning problem is regression or classification?", "opts": ["The type of input data", "The number of features", "The kind of output being predicted", "The size of the training set"], "ans": [2], "ex": "问题类型只看输出：输出连续是回归，输出离散类别是分类。输入的类型、特征数、数据量都不决定问题类型。"}, {"w": 1, "type": "mc", "title": "用哪个数据集选模型", "q": "Which dataset should be used to choose between different models?", "opts": ["Training set", "Validation set", "Test set", "Entire labeled dataset combined"], "ans": [1], "ex": "三个数据集分工不同：训练集 (training set) 拟合参数，验证集 (validation set) 选超参数和模型，测试集 (test set) 只在最后用一次，估计泛化误差。用测试集选模型等于把它泄露进了训练过程，泛化估计会偏乐观。"}, {"w": 1, "type": "mc", "title": "上标 (i) 的含义", "q": "In the notation $x^{(i)}$, what does the superscript $(i)$ indicate?", "opts": ["The $i$-th input vector in the dataset", "The $i$-th feature of a single example", "The $i$-th class label", "The exponent applied to the vector $\\mathbf{x}$"], "ans": [0], "ex": "上标 $(i)$ 表示第 $i$ 个训练样本 $\\mathbf{x}^{(i)}$ ；下标 $x_j$ 才表示第 $j$ 个特征。两者组合起来， $x_j^{(i)}$ 就是第 $i$ 个样本的第 $j$ 个特征。"}, {"w": 1, "type": "mc", "title": "MNIST 的数据增强", "q": "Which of the following is an example of data augmentation for MNIST?", "opts": ["Changing every label to the most common class", "Replacing grayscale values with color channels", "Shifting or rotating the image", "Removing difficult examples from the training set"], "ans": [2], "ex": "数据增强 (data augmentation) 对样本做保持标签不变的变换，比如平移、旋转，生成更多训练数据。改标签、删样本都不是增强；灰度图变彩色也不保持语义，同样不算。"}, {"w": 1, "type": "mc", "title": "kNN 的基本思想", "q": "Which of the following is the correct idea behind k-nearest neighbours?", "opts": ["Predict by calculating the distance to the centroid of each class", "Predict using the average feature vector of the training set", "Predict using the majority class among the k closest training examples", "Partition the training data into k clusters and assign the query point to the nearest cluster center"], "ans": [2], "ex": "kNN 先找出离查询点最近的 $k$ 个训练样本，再对它们的标签做多数投票 (majority vote)。A 是最近质心分类器，D 是 k-means 聚类，都不是 kNN。"}, {"w": 1, "type": "mc", "title": "方向比大小重要时用什么度量", "q": "Which of the following is said to be especially useful when the direction of vectors matters more than their magnitude, such as in text classification?", "opts": ["Euclidean distance", "Manhattan distance", "Chebyshev distance", "Cosine similarity"], "ans": [3], "ex": "余弦相似度 (cosine similarity) $\\frac{\\mathbf{a}^\\top\\mathbf{b}}{\\lVert\\mathbf{a}\\rVert\\lVert\\mathbf{b}\\rVert}$ 只看两个向量的夹角，与长度无关。文本的词频向量会随文档长度变大，但主题由方向决定，所以适合用余弦相似度。"}, {"w": 1, "type": "mc", "title": "k 是什么", "q": "The number k in k nearest neighbours is an example of what?", "opts": ["Feature", "Label", "Hyperparameter", "Decision boundary"], "ans": [2], "ex": "$k$ 不是从训练数据里学出来的，而是训练前人为设定、在验证集上调的值，所以是超参数 (hyperparameter)。"}, {"w": 1, "type": "mc", "title": "3-NN 与 1-NN 的决策边界", "q": "Compared with 1-NN, a 3-NN typically has a decision boundary that is:", "opts": ["Smoother and less sensitive to individual training points", "Identical whenever Euclidean distance is used", "More jagged because three points create more boundaries", "Guaranteed to achieve higher training accuracy"], "ans": [0], "ex": "$k$ 越大，单个噪声点对投票的影响越小，决策边界越平滑，越不容易过拟合。1-NN 的边界最锯齿化，训练精度通常最高（100%），所以 D 错。"}, {"w": 1, "type": "tf", "title": "1-NN 训练精度 100%", "q": "Unless there are identical points with different labels, 1-NN achieves 100% training accuracy.", "opts": ["True", "False"], "ans": [0], "ex": "对训练点做预测时，离它最近的就是它自己（距离为 0），所以预测出的就是它自己的标签。唯一的例外是同一个位置有标签不同的重复点。"}, {"w": 1, "type": "mc", "title": "k = N 的极端情况", "q": "What happens in the extreme case k=N, where N is the size of the training set?", "opts": ["The model predicts the label of the nearest point only", "The model always predicts the most common class in the training set", "The model becomes equivalent to 1-NN", "The model achieves zero training error by construction"], "ans": [1], "ex": "$k=N$ 时，每次投票都用上全部训练点，结果与查询点在哪里无关，模型总是预测训练集里最常见的类别，严重欠拟合 (underfitting)。"}, {"w": 1, "type": "mc", "title": "实践中如何选 k", "q": "In practice, how do we choose the value of k for a k nearest neighbour model for a given dataset?", "opts": ["By always setting k=1", "By selecting the largest possible k", "By evaluating different values on a validation set", "By computing it directly from the test set"], "ans": [2], "ex": "超参数在验证集上调：多试几个 $k$ ，选验证误差最小的那个。不能用测试集来选（理由见“用哪个数据集选模型”那题）。"}, {"w": 1, "type": "mc", "title": "特征尺度不同对 kNN 的影响", "q": "If feature A is measured on a much larger scale than feature B, then in k-NN:", "opts": ["Differences in feature B have a larger effect on neighbor selection", "The algorithm automatically rescales all features before computing distances", "Both features always contribute equally to the distance calculation", "Differences in feature A can have a larger effect on distance calculations"], "ans": [3], "ex": "欧氏距离 $\\sqrt{\\sum_j (x_j-x'_j)^2}$ 里，尺度大的特征差值大，会主导距离。kNN 不会自动缩放，所以通常先做标准化 (standardization)。"}, {"w": 1, "type": "mc", "title": "训练集精度 100% 意味着什么", "q": "A classifier has perfect accuracy on its training set. What is the most likely conclusion?", "opts": ["It will necessarily achieve perfect test accuracy", "It may have overfit the training set", "It must be less complex than any classifier with lower training accuracy", "It should be trained on less data"], "ans": [1], "ex": "训练误差为 0 并不保证泛化好，反而可能是过拟合 (overfitting)：模型把噪声也记住了。泛化好不好要看验证集或测试集上的误差。"}, {"w": 1, "type": "mc", "title": "高维空间中的欧氏距离", "q": "In high dimensions, what happens to the Euclidean distances between randomly sampled points?", "opts": ["Most points are clustered near the origin", "Most points are either very close or very far apart", "Most points are far apart from each other", "Distances decrease as dimensionality increases"], "ans": [2], "ex": "维数灾难 (curse of dimensionality)：维度越高，空间体积指数增长，随机点之间大多相距很远，而且距离差不多（最近邻与最远邻的距离趋于相近）。"}, {"w": 1, "type": "ma", "title": "维数灾难对 kNN 的影响（多选）", "q": "Which of the following statements describe the curse of dimensionality in the context of k-NN? Select all that apply.", "opts": ["k-NN may require much more data to make reliable predictions in high dimensions.", "Increasing the number of dimensions guarantees higher prediction accuracy", "In high dimensions, the nearest and farthest neighbors can have similar distances", "The curse of dimensionality disappears if k is chosen large enough."], "ans": [0, 2], "ex": "高维时，要覆盖整个空间需要的样本量随维度指数增长，而且最近邻和最远邻的距离接近，“近邻”失去意义。增加维度不保证提升精度；调大 $k$ 也解决不了这个问题。"}, {"w": 2, "type": "mc", "title": "什么是决策树", "q": "What is a decision tree?", "opts": ["A sequence of layered if-else statements used to make predictions on new data", "A method that always compares a test point to every training example in the dataset", "A model that can only be used for regression problems and not classification", "A random process for selecting class labels without using input features"], "ans": [0], "ex": "决策树 (decision tree) 是一层套一层的 if-else：每个内部节点测试一个条件，走到叶子节点得到预测。它既能做分类也能做回归；B 描述的是 kNN。"}, {"w": 2, "type": "mc", "title": "非叶节点的作用", "q": "What does a non-leaf node in a decision tree do?", "opts": ["Aggregates the final predictions from its child nodes to produce an output", "Tests a condition on one feature to decide which child to follow", "Stores all training examples that reach the node for nearest-neighbor comparison", "Assigns a probability distribution over classes without making a split"], "ans": [1], "ex": "内部节点 (internal node) 只对一个特征做测试，例如 $x_j\\le\\theta$ ，根据结果走向某个子节点。真正给出预测的是叶子节点。"}, {"w": 2, "type": "mc", "title": "什么是决策边界", "q": "What is a decision boundary?", "opts": ["The set of training examples that are misclassified", "A set of lines that separates data perfectly based on their class", "A partition of the data space corresponding to predicted classes", "The maximum depth of a decision tree"], "ans": [2], "ex": "决策边界 (decision boundary) 把输入空间切分成若干区域，每个区域对应一个预测类别。它不一定能完美分开数据，所以 B 错。"}, {"w": 2, "type": "mc", "title": "熵衡量什么", "q": "What quantity is entropy used to measure?", "opts": ["The number of nodes in a decision tree", "The uncertainty in a probability distribution", "The accuracy of k-nearest neighbours", "The amount of training data stored by a model"], "ans": [1], "ex": "熵 (entropy) $H(Y)=-\\sum_y p(y)\\log_2 p(y)$ 衡量一个分布的不确定性：分布越均匀熵越大，越确定熵越小。"}, {"w": 2, "type": "mc", "title": "确定事件的熵", "q": "If a random variable has one outcome with probability 1, what is its entropy in bits?", "opts": ["$0$", "$1$", "$\\infty$", "$-\\infty$"], "ans": [0], "ex": "$H=-1\\cdot\\log_2 1=0$ （约定 $0\\log 0=0$ ）。结果完全确定时没有不确定性，所以熵为 0。"}, {"w": 2, "type": "mc", "title": "计算二元变量的熵", "q": "For a binary random variable $Y$ with $P(Y=1)=0.75$ and $P(Y=0)=0.25$, which of the following correctly computes the entropy $H(Y)$ in bits?", "opts": ["$H(Y) = -(0.75\\log_2 0.25 + 0.25\\log_2 0.75)$", "$H(Y) = 0.75\\log_2 0.75 + 0.25\\log_2 0.25$", "$H(Y) = 0.75\\log_2 0.25 + 0.25\\log_2 0.75$", "$H(Y) = -(0.75\\log_2 0.75 + 0.25\\log_2 0.25)$"], "ans": [3], "ex": "按定义 $H(Y)=-\\sum_y p(y)\\log_2 p(y)$ ：每个概率乘以它自己的对数，最后加负号，结果约为 $0.811$ bits。B 少了负号，结果为负；A、C 把概率和对数配错了。"}, {"w": 2, "type": "mc", "title": "条件熵衡量什么", "q": "What does conditional entropy measure?", "opts": ["The average amount of uncertainty remaining in $Y$ once the value of $X$ is known", "The prior uncertainty of $X$ before any information about $Y$ has been collected", "The total reduction in the entropy of $Y$ achieved by conditioning on $X$", "The combined entropy across variables $X$ and $Y$ simultaneously"], "ans": [0], "ex": "条件熵 (conditional entropy) $H(Y\\mid X)=\\sum_x p(x)H(Y\\mid X=x)$ 是知道 $X$ 之后， $Y$ 平均还剩多少不确定性。C 描述的是信息增益，D 描述的是联合熵 $H(X,Y)$ 。"}, {"w": 2, "type": "mc", "title": "计算 H(Y | X=x)", "q": "Suppose $P(Y=1 \\mid X=x)=0.9$ and $P(Y=0 \\mid X=x)=0.1$. Which of the following correctly computes the conditional entropy $H(Y \\mid X=x)$ in bits?", "opts": ["$H(Y \\mid X=x) = -(0.9\\log_2 0.1 + 0.1\\log_2 0.9)$", "$H(Y \\mid X=x) = 0.9\\log_2 0.1 + 0.1\\log_2 0.9$", "$H(Y \\mid X=x) = -(0.9\\log_2 0.9 + 0.1\\log_2 0.1)$", "$H(Y \\mid X=x) = 0.9\\log_2 0.9 + 0.1\\log_2 0.1$"], "ans": [2], "ex": "固定 $X=x$ 后，就是对条件分布求熵： $-\\sum_y p(y\\mid x)\\log_2 p(y\\mid x)\\approx0.469$ bits。错误选项的配对方式和“计算二元变量的熵”那题一样。"}, {"w": 2, "type": "mc", "title": "信息增益的定义", "q": "What is the information gain about random variable $Y$ by observing random variable $X$ defined as?", "opts": ["$H(X)+H(Y)$", "$H(Y \\mid X)-H(Y)$", "$H(Y)-H(Y \\mid X)$", "$H(X,Y)-H(X)$"], "ans": [2], "ex": "信息增益 (information gain) $IG(Y\\mid X)=H(Y)-H(Y\\mid X)$ 表示观测 $X$ 后 $Y$ 的不确定性减少了多少。B 刚好写反了，结果非正；D 其实等于 $H(Y\\mid X)$ 。"}, {"w": 2, "type": "tf", "title": "信息增益恒非负", "q": "Information gain about random variable $Y$ by observing random variable $X$ is always nonnegative.", "opts": ["True", "False"], "ans": [0], "ex": "$IG=H(Y)-H(Y\\mid X)=I(X;Y)\\ge0$ ：多知道一个信息，平均来说不会让不确定性增加 (information can't hurt)。等号在 $X$ 与 $Y$ 独立时成立。"}, {"w": 2, "type": "tf", "title": "决策树边界总是轴对齐", "q": "Decision tree decision boundaries are always axis-aligned because each split tests a threshold on a single feature.", "opts": ["True", "False"], "ans": [0], "ex": "每次分裂只检查 $x_j\\le\\theta$ ，对应一个垂直于某条坐标轴的超平面，所以决策边界由轴对齐 (axis-aligned) 的矩形块拼成。"}, {"w": 2, "type": "mc", "title": "只用训练误差做分裂准则的局限", "q": "What is a limitation of using training error alone as a split criterion in a decision tree?", "opts": ["It ignores the remaining uncertainty in the resulting child nodes", "It can only be used to evaluate binary classification problems", "It requires all input features to support a differentiable error metric", "It cannot be applied when the input features take continuous values"], "ans": [0], "ex": "两种分裂可能误分类数相同，但其中一种让某个子节点变得更纯（不确定性更低），更有利于后续继续分裂。误分类率看不出这种差别，熵或信息增益可以。"}, {"w": 2, "type": "mc", "title": "多数投票预测什么", "q": "What does the majority vote choose to predict?", "opts": ["The class with the smallest entropy in the full dataset", "The most common class among the training points in that region", "A randomly chosen class from the region", "The class associated with the nearest training point"], "ans": [1], "ex": "叶子节点（区域）内的预测，是落进这个区域的训练样本中出现次数最多的类别。"}, {"w": 2, "type": "tf", "title": "贪心算法能否保证全局最优树", "q": "A greedy decision tree algorithm guarantees the globally optimal tree.", "opts": ["True", "False"], "ans": [1], "ex": "贪心算法每一步只选当前信息增益最大的分裂，不回头修改。找全局最优树是 NP-hard 问题，贪心只能得到一个够用的近似解。"}, {"w": 2, "type": "mc", "title": "连续特征只需检查有限个阈值", "q": "Why do decision tree algorithms only need to evaluate finitely many split thresholds for a continuous feature?", "opts": ["Only thresholds between two observed values of the feature can change how the data points are partitioned", "Continuous features must first be converted into a small number of discrete categories before any splitting occurs", "Decision trees are limited to working with features that have a small and bounded range of values", "Every valid threshold must be chosen to exactly equal one of the feature values observed in the training data"], "ans": [0], "ex": "$N$ 个样本在某个特征上最多有 $N$ 个不同取值。阈值只有跨过一个观测值时，划分结果才会改变，所以只需检查相邻观测值之间的位置（通常取中点），最多 $N-1$ 个候选。D 的说法太绝对。"}, {"w": 2, "type": "ma", "title": "决策树的停止准则（多选）", "q": "Which of the following can be used as a stopping criterion during decision tree learning? Select all that apply.", "opts": ["Stop splitting when the tree reaches a predefined maximum depth", "Stop splitting when a node contains fewer than a minimum number of samples", "Stop splitting when the best split produces too little information gain", "Stop splitting when all remaining features have different numeric scales"], "ans": [0, 1, 2], "ex": "常见的停止准则有三种：达到最大深度、节点样本数太少、最佳分裂的信息增益低于阈值。三者都能限制树的复杂度，防止过拟合。特征尺度与决策树无关（树对尺度不敏感），所以 D 不是停止准则。"}, {"w": 3, "type": "mc", "title": "模型参数", "q": "A model parameter is best described as:", "opts": ["A value the learning algorithm automatically learns from the training data", "A setting chosen before training and typically tuned using the validation data", "A value that determines the number of features in the input vector", "A value fixed by the test set to measure generalization performance"], "ans": [0], "ex": "参数 (parameter)，比如 $\\mathbf{w}$ 、 $b$ ，是从训练数据中学出来的。B 描述的是超参数 (hyperparameter)。"}, {"w": 3, "type": "mc", "title": "损失函数衡量什么", "q": "The loss function measures:", "opts": ["The discrepancy between the prediction and the target value for one example", "The average discrepancy between predictions and targets across the entire training set", "The discrepancy between the model's and a perfect model's prediction", "The average discrepancy between the prediction and the target value for one batch"], "ans": [0], "ex": "损失 (loss) $\\mathcal{L}(y,t)$ 针对单个样本；对整个训练集取平均得到的是代价函数 (cost) $\\mathcal{E}=\\frac1N\\sum_i\\mathcal{L}(y^{(i)},t^{(i)})$ ，也就是 B 描述的东西。"}, {"w": 3, "type": "mc", "title": "平方误差损失的形式", "q": "The squared error loss used for regression is:", "opts": ["$\\frac{1}{2}\\lvert y-t\\rvert$", "$(y-t)^2+\\frac{1}{2}$", "$\\frac{1}{N}(y-t)^2$", "$\\frac{1}{2}(y-t)^2$"], "ans": [3], "ex": "$\\mathcal{L}_{SE}=\\frac12(y-t)^2$ ，系数 $\\frac12$ 是为了求导后和平方的 2 抵消。 $\\frac1N$ 出现在对所有样本求平均的代价函数里，不在单个样本的损失里。"}, {"w": 3, "type": "mc", "title": "设计矩阵的定义", "q": "The data matrix (design matrix) $\\mathbf{X}$ is defined so that:", "opts": ["Each row is a weight vector and each column is a different training label", "Each row contains the features for one example and each column contains one feature across all examples", "Each row contains the prediction error with each example and each column is a different model parameter", "Each row contains one feature across all examples and each column contains the features for one example"], "ans": [1], "ex": "$\\mathbf{X}\\in\\mathbb{R}^{N\\times D}$ （加偏置列后是 $N\\times(D+1)$ ）： $N$ 是样本数， $D$ 是特征数。每一行是一个样本，每一列是一个特征。"}, {"w": 3, "type": "mc", "title": "线性模型的标量形式", "q": "For a linear model with $D$ features, the scalar-form prediction is:", "opts": ["$y=\\sum_{j=1}^D w_j x_j + b$", "$y=\\sum_{j=1}^D (w_j x_j)^2 + b$", "$y=\\sum_{j=1}^D \\frac{x_j}{w_j} + b$", "$y=\\sum_{j=1}^D w_j + x_j + b$"], "ans": [0], "ex": "线性模型是每个特征乘以对应权重，求和后再加偏置 $b$ 。"}, {"w": 3, "type": "mc", "title": "向量化预测公式", "q": "With the design matrix $\\mathbf{X}\\in\\mathbb{R}^{N\\times(D+1)}$ and weights $\\mathbf{w}\\in\\mathbb{R}^{(D+1)\\times 1}$, the vectorized prediction equation is:", "opts": ["$\\mathbf{y}=\\mathbf{w}\\mathbf{X}$", "$\\mathbf{y}=\\mathbf{X}^\\top \\mathbf{w}$", "$\\mathbf{y}=\\mathbf{w}^\\top \\mathbf{X}$", "$\\mathbf{y}=\\mathbf{X}\\mathbf{w}$"], "ans": [3], "ex": "检查维度： $(N\\times(D+1))\\cdot((D+1)\\times1)=N\\times1$ ，正好得到每个样本一个预测。其他三个选项的维度对不上。"}, {"w": 3, "type": "mc", "title": "向量化的 MSE 代价", "q": "The vectorized MSE cost function can be written as:", "opts": ["$\\mathcal{E}(\\mathbf{w})=\\frac{1}{2N}(\\mathbf{X}\\mathbf{w}-\\mathbf{t})^\\top(\\mathbf{X}\\mathbf{w}-\\mathbf{t})$", "$\\mathcal{E}(\\mathbf{w})=\\frac{1}{2N}(\\mathbf{X}^\\top\\mathbf{w}-\\mathbf{t})^\\top(\\mathbf{X}^\\top\\mathbf{w}-\\mathbf{t})$", "$\\mathcal{E}(\\mathbf{w})=\\frac{1}{2N}(\\mathbf{X}\\mathbf{t}-\\mathbf{w})^\\top(\\mathbf{X}\\mathbf{t}-\\mathbf{w})$", "$\\mathcal{E}(\\mathbf{w})=\\frac{1}{2N}(\\mathbf{w}^\\top\\mathbf{X}-\\mathbf{t})^\\top(\\mathbf{w}^\\top\\mathbf{X}-\\mathbf{t})$"], "ans": [0], "ex": "残差向量是 $\\mathbf{X}\\mathbf{w}-\\mathbf{t}\\in\\mathbb{R}^N$ ，它和自己的内积就是平方和，再乘以 $\\frac1{2N}$ 得到 $\\frac1{2N}\\sum_i(y^{(i)}-t^{(i)})^2$ 。"}, {"w": 3, "type": "mc", "title": "MSE 的向量化梯度", "q": "The vectorized gradient of the MSE cost given in the note is:", "opts": ["$\\nabla_{\\mathbf{w}}\\mathcal{E}(\\mathbf{w})=\\frac{1}{N}\\mathbf{X}^\\top(\\mathbf{X}\\mathbf{w}-\\mathbf{t})$", "$\\nabla_{\\mathbf{w}}\\mathcal{E}(\\mathbf{w})=\\frac{1}{N}\\mathbf{X}(\\mathbf{X}\\mathbf{w}-\\mathbf{t})$", "$\\nabla_{\\mathbf{w}}\\mathcal{E}(\\mathbf{w})=\\frac{1}{N}\\mathbf{X}(\\mathbf{X}^\\top\\mathbf{w}-\\mathbf{t})$", "$\\nabla_{\\mathbf{w}}\\mathcal{E}(\\mathbf{w})=\\frac{1}{N}\\mathbf{X}^\\top(\\mathbf{X}^\\top\\mathbf{w}-\\mathbf{t})$"], "ans": [0], "ex": "梯度的维度要和 $\\mathbf{w}$ 一样，是 $(D+1)\\times1$ 。 $\\mathbf{X}^\\top$ 的维度是 $(D+1)\\times N$ ，乘以 $N\\times1$ 的残差向量，维度正好对上。"}, {"w": 3, "type": "mc", "title": "闭式解", "q": "The closed-form (direct) solution for the weights is:", "opts": ["$\\mathbf{w}=(\\mathbf{X}\\mathbf{X}^\\top)^{-1}\\mathbf{X}\\mathbf{t}$", "$\\mathbf{w}=(\\mathbf{X}^\\top\\mathbf{X})^{-1}\\mathbf{X}^\\top\\mathbf{t}$", "$\\mathbf{w}=\\mathbf{X}^{-1}\\mathbf{t}$", "$\\mathbf{w}=\\mathbf{X}^\\top(\\mathbf{X}\\mathbf{X}^\\top)^{-1}\\mathbf{t}$"], "ans": [1], "ex": "令梯度为 0： $\\mathbf{X}^\\top\\mathbf{X}\\mathbf{w}=\\mathbf{X}^\\top\\mathbf{t}$ （正规方程，normal equations），解出 $\\mathbf{w}=(\\mathbf{X}^\\top\\mathbf{X})^{-1}\\mathbf{X}^\\top\\mathbf{t}$ 。 $\\mathbf{X}$ 一般不是方阵，所以不能直接求逆，C 错。"}, {"w": 3, "type": "mc", "title": "梯度下降是什么", "q": "Gradient descent is best described as an algorithm that does which of the following?", "opts": ["Solves for the zeros of the gradient algebraically in one step", "Iteratively updates parameters in a direction that reduces the function being minimized", "Randomly samples parameter values until it finds the best one", "Updates the parameters stepwise in the direction of the global minimum of the function being minimized"], "ans": [1], "ex": "梯度下降的更新是 $\\mathbf{w}\\leftarrow\\mathbf{w}-\\alpha\\nabla J$ ，沿局部下降方向迭代。负梯度方向不一定指向全局最小值，所以 D 错；A 描述的是闭式解。"}, {"w": 3, "type": "mc", "title": "梯度指向哪里", "q": "For a differentiable function $J(\\mathbf{w})$, the gradient $\\nabla_{\\mathbf{w}}J(\\mathbf{w})$ points in which direction?", "opts": ["The direction of steepest descent", "A direction that always points toward the global minimum", "The direction of steepest ascent", "A direction parallel to the contour lines"], "ans": [2], "ex": "梯度指向函数上升最快的方向 (steepest ascent)，所以梯度下降要沿负梯度走。梯度与等高线垂直，不是平行，所以 D 错。"}, {"w": 3, "type": "mc", "title": "学习率过大的后果", "q": "If the learning rate is too large, what is a likely consequence?", "opts": ["The cost must decrease at every iteration", "The algorithm becomes the closed-form solution", "Updates may overshoot the minimum and move farther away", "The gradient becomes perpendicular to the contour lines for the first time"], "ans": [2], "ex": "步长太大会越过最低点，在谷底两侧来回震荡，甚至发散。学习率太小则收敛很慢。"}, {"w": 3, "type": "mc", "title": "特征映射的定义", "q": "What is the mathematical definition of a feature mapping in the context of linear regression?", "opts": ["A function that transforms each input vector into a new representation.", "A procedure that maps input features directly to their corresponding training targets.", "A strategy for reducing the total number of data points to limit computation time.", "An algorithm that selects the most important original features from a dataset."], "ans": [0], "ex": "特征映射 (feature mapping) $\\boldsymbol{\\psi}(\\mathbf{x})$ ，例如多项式特征 $[1,x,x^2,\\dots]$ ，把输入变换成新的表示。在新特征上仍然做线性回归，就能拟合非线性关系。"}, {"w": 3, "type": "mc", "title": "正则化系数 λ 太小", "q": "If the $\\lambda$ in $\\mathcal{E}(\\mathbf{w}) + \\lambda \\mathcal{R}(\\mathbf{w})$ is too small, then", "opts": ["The regularizer dominates and the model may underfit", "The MSE term dominates and overfitting may remain", "The bias term is forced to zero", "The polynomial degree decreases automatically"], "ans": [1], "ex": "$\\lambda\\to0$ 相当于没有正则化，MSE 项占主导，模型仍可能过拟合。 $\\lambda$ 太大时正则项占主导，权重被压得太小，会欠拟合，这就是 A 描述的情况。"}, {"w": 3, "type": "mc", "title": "正则化的含义", "q": "Regularization is a modification of training that", "opts": ["Chooses models using criteria beyond training error", "Forces all weights to have similar scale during training", "Guarantees zero training error on the dataset", "Removes the need to tune hyperparameters"], "ans": [0], "ex": "正则化 (regularization) 在训练误差之外，再加入对模型复杂度的偏好，例如惩罚 $\\lVert\\mathbf{w}\\rVert^2$ 。它会引入新的超参数 $\\lambda$ ，所以 D 错。"}, {"w": 4, "type": "mc", "title": "sigmoid 公式", "q": "Which of the following is the correct formula for the sigmoid activation function $\\sigma(z)$?", "opts": ["$\\sigma(z) = \\frac{e^z}{e^z + e^{-z}}$", "$\\sigma(z) = \\max(0, z)$", "$\\sigma(z) = \\frac{e^z - e^{-z}}{e^z + e^{-z}}$", "$\\sigma(z) = \\frac{1}{1 + e^{-z}}$"], "ans": [3], "ex": "$\\sigma(z)=\\frac1{1+e^{-z}}\\in(0,1)$ 。B 是 ReLU，C 是 $\\tanh$ ，A 其实等于 $\\sigma(2z)$ 。"}, {"w": 4, "type": "mc", "title": "交叉熵损失", "q": "The cross-entropy loss $\\mathcal{L}_{CE}(y,t)$ for logistic regression is defined as which expression?", "opts": ["$\\mathcal{L}_{CE}(y,t) = t \\cdot y + (1-t) \\cdot (1-y)$", "$\\mathcal{L}_{CE}(y,t) = (y - t)^2$", "$\\mathcal{L}_{CE}(y,t) = |y - t|$", "$\\mathcal{L}_{CE}(y,t) = -t\\log(y) - (1-t)\\log(1-y)$"], "ans": [3], "ex": "交叉熵 (cross-entropy) $\\mathcal{L}_{CE}=-t\\log y-(1-t)\\log(1-y)$ 。 $t=1$ 时只剩 $-\\log y$ ， $t=0$ 时只剩 $-\\log(1-y)$ 。预测越自信却越错，惩罚越接近无穷大。"}, {"w": 4, "type": "mc", "title": "逻辑回归输出的含义", "q": "The output $y = \\sigma(\\mathbf{w}^\\top \\mathbf{x})$ of a logistic regression model represents which quantity?", "opts": ["The Euclidean distance from input $\\mathbf{x}$ to the decision boundary", "The predicted class label assigned to input $\\mathbf{x}$", "The probability of the positive class given input $\\mathbf{x}$", "The magnitude of the weight vector $\\mathbf{w}$ projected onto $\\mathbf{x}$"], "ans": [2], "ex": "$y=p(t=1\\mid\\mathbf{x})$ 是正类的概率。把 $y$ 与阈值 0.5 比较之后，才得到类别标签。"}, {"w": 4, "type": "mc", "title": "平方误差做二分类的问题", "q": "Why is the squared error loss problematic when applied to binary classification?", "opts": ["It requires the model to output continuous values between negative and positive infinity", "It produces output values that are outside the range $(0,1)$", "It assigns infinite loss to every misclassified example", "It penalizes confident correct predictions"], "ans": [3], "ex": "线性模型加平方误差时，如果 $t=1$ 而预测 $y=5$ ，方向判断得很对，但 $(5-1)^2$ 很大，模型反而因为“太正确”被惩罚，决策边界会被这些点拉偏。参见错题集 logistic_regression 第 2 题。"}, {"w": 4, "type": "mc", "title": "逻辑回归相对 kNN 的优势", "q": "Which of the following is an advantage of logistic regression over $k$-nearest neighbors?", "opts": ["Logistic regression can learn complex nonlinear decision boundaries", "Logistic regression stores the entire training dataset for making predictions", "Logistic regression automatically increases model complexity with more training data", "Logistic regression provides fast predictions by using a fixed set of learned weights"], "ans": [3], "ex": "逻辑回归是参数模型 (parametric)，预测时只需算一次 $\\sigma(\\mathbf{w}^\\top\\mathbf{x})$ ，复杂度 $O(D)$ 。kNN 预测时要和全部 $N$ 个训练样本算距离。A、B、C 描述的都是 kNN 的特点。"}, {"w": 4, "type": "mc", "title": "全批量梯度下降用多少样本", "q": "In full batch gradient descent, the gradient of the cost function is computed using how many training examples per update?", "opts": ["A small random subset of the training examples", "All $N$ training examples in the dataset", "Only the training examples that are currently misclassified", "A single randomly selected training example"], "ans": [1], "ex": "全批量 (full batch) 每次更新都用全部 $N$ 个样本算梯度。A 是 mini-batch SGD，D 是单样本 SGD。"}, {"w": 4, "type": "mc", "title": "mini-batch 的定义", "q": "In stochastic gradient descent, a mini-batch is best described as which of the following?", "opts": ["The set of all misclassified examples identified after each epoch", "The entire training dataset used in each gradient computation", "A single example selected in fixed sequential order from the dataset", "A small subset of $k$ examples used to estimate the gradient"], "ans": [3], "ex": "mini-batch 是随机抽出的 $k$ 个样本，用它们的平均梯度估计全量梯度。这个估计是无偏的，而且计算成本低。"}, {"w": 4, "type": "mc", "title": "ravine（峡谷）的成因", "q": "A ravine in the optimization landscape arises when which condition holds?", "opts": ["The loss function is equally steep in every weight direction", "Training progresses smoothly as there is a clear direction to the minimum", "Different weight dimensions have very different gradient magnitudes", "The training data contains an unequal number of positive and negative examples"], "ans": [2], "ex": "峡谷 (ravine) 指某些方向很陡、另一些方向很平。这时梯度下降会在陡的方向来回震荡，在平的方向前进很慢。常见原因是特征尺度不一致，解决办法是特征标准化。"}, {"w": 4, "type": "mc", "title": "学习率过大", "q": "If the learning rate is set too large during gradient descent optimization, what is the likely outcome?", "opts": ["The optimization diverges and the loss function increases without bound", "The optimization finds a better minimum with higher generalization accuracy", "The optimization converges more slowly toward the minimum of the loss", "The optimization path becomes smoother and more stable over time"], "ans": [0], "ex": "学习率过大时每一步都越过最低点，而且越走越远，损失发散。收敛变慢是学习率太小时的表现，对应 C。"}, {"w": 4, "type": "mc", "title": "SGD 噪声的好处", "q": "How can the noisy gradient updates in SGD be beneficial during optimization?", "opts": ["They can help the optimization escape flat regions such as plateaus", "They guarantee that the algorithm always finds the global minimum", "They completely eliminate the need for feature standardization", "They ensure convergence in fewer iterations than full batch descent"], "ans": [0], "ex": "梯度估计里的随机噪声能帮助参数跳出平台区 (plateau) 和较差的局部极小值，但不能保证找到全局最优。按迭代次数算，SGD 通常需要更多步，只是每一步便宜得多。"}, {"w": 4, "type": "mc", "title": "多分类目标的表示", "q": "In multi-class classification with $K$ classes, the target is represented as which of the following?", "opts": ["A one-hot vector in $\\mathbb{R}^K$ with a single $1$ and the rest $0$s", "A binary vector in $\\{0,1\\}^K$ with multiple entries equal to $1$", "An integer value from $1$ to $K$ stored as a single scalar", "A probability distribution over the $K$ classes that sums to one"], "ans": [0], "ex": "目标用 one-hot 编码 $\\mathbf{t}\\in\\{0,1\\}^K$ ，只有真实类别那一位是 1。多个位置为 1 的是多标签 (multi-label) 问题；D 描述的是模型输出 $\\mathbf{y}$ ，不是目标。"}, {"w": 4, "type": "mc", "title": "softmax 的输出", "q": "The softmax function maps a vector of logits $\\mathbf{z} \\in \\mathbb{R}^K$ to which type of output?", "opts": ["A binary vector where the entry for the largest logit becomes $1$", "A probability distribution", "A normalized vector with unit Euclidean magnitude", "A vector of integer rankings from the best class to the worst class"], "ans": [1], "ex": "$y_k=\\frac{e^{z_k}}{\\sum_{k'}e^{z_{k'}}}$ ，每一项都为正，而且总和为 1，所以是一个概率分布。A 描述的是 argmax（硬 one-hot）。"}, {"w": 4, "type": "mc", "title": "softmax 回归的决策边界", "q": "The decision boundary between classes $i$ and $j$ in softmax regression is defined by which condition?", "opts": ["The cross-entropy loss for class $i$ equals the loss for class $j$", "The softmax probability for class $i$ equals exactly $0.5$", "The logits for both classes are equal", "The weight vectors for classes $i$ and $j$ are perpendicular to each other"], "ans": [2], "ex": "softmax 是单调的，所以 $y_i=y_j\\iff z_i=z_j\\iff(\\mathbf{w}_i-\\mathbf{w}_j)^\\top\\mathbf{x}+(b_i-b_j)=0$ ，这是一个超平面。有 $K>2$ 个类时，边界上的概率不一定是 0.5，所以 B 错。"}, {"w": 4, "type": "mc", "title": "成对决策边界的数量", "q": "For a softmax regression model with $K$ classes, how many pairwise decision boundaries exist?", "opts": ["$K^2$ boundaries", "$K$ boundaries", "$K(K-1)/2$ boundaries", "$K - 1$ boundaries"], "ans": [2], "ex": "每一对类别 $(i,j)$ 有一条边界，一共有 $\\binom K2=K(K-1)/2$ 对。"}];
const L="ABCDEFG";
const TYPE={mc:"单选",tf:"判断",ma:"多选"};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let hist=store.get("csc311-hist",{}); // id -> {seen, wrong, streak}
let weeks=new Set(store.get("csc311-weeks",[1,2,3,4]));
let mode="all", queue=[], cur=null, picked=new Set(), answered=false, total=0, doneCount=0, again=new Set();
Q.forEach((q,i)=>q.id=i);

function renderMath(el){if(window.renderMathInElement)renderMathInElement(el,{delimiters:[{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],throwOnError:false})}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}

function buildWeeks(){
  const box=document.getElementById("weeks");box.innerHTML="";
  [1,2,3,4].forEach(w=>{const b=document.createElement("button");b.className="chip";b.textContent="Week "+w;b.setAttribute("aria-pressed",weeks.has(w));
    b.onclick=()=>{weeks.has(w)?weeks.delete(w):weeks.add(w);if(!weeks.size)weeks.add(w);store.set("csc311-weeks",[...weeks]);buildWeeks();start()};box.appendChild(b)});
}
function setMode(m){mode=m;document.getElementById("m-all").setAttribute("aria-pressed",m==="all");document.getElementById("m-weak").setAttribute("aria-pressed",m==="weak");start()}
document.getElementById("m-all").onclick=()=>setMode("all");
document.getElementById("m-weak").onclick=()=>setMode("weak");

function start(){
  let pool=Q.filter(q=>weeks.has(q.w));
  if(mode==="weak")pool=pool.filter(q=>(hist[q.id]?.wrong||0)>0&&(hist[q.id]?.streak||0)<2);
  queue=shuffle(pool.map(q=>q.id));total=queue.length;doneCount=0;again.clear();next();
}
function stats(){
  const seen=Object.keys(hist).length, weak=Q.filter(q=>(hist[q.id]?.wrong||0)>0&&(hist[q.id]?.streak||0)<2).length;
  document.getElementById("stats").textContent=`已做 ${seen}/${Q.length} · 待巩固 ${weak}`;
  document.getElementById("prog").style.width=(total?doneCount/total*100:0)+"%";
}
function next(){
  stats();const card=document.getElementById("card");
  if(!queue.length){
    card.innerHTML=total?`<div class="done"><div class="big">${total}/${total}</div><div>这一轮全部答对了。</div><button class="btn" id="again">再来一轮</button></div>`
      :`<div class="done"><div class="big">0</div><div>当前选择下没有错题。切回“全部乱序”刷新题吧。</div><button class="btn" id="again">全部乱序</button></div>`;
    document.getElementById("again").onclick=()=>total?start():setMode("all");cur=null;return;
  }
  cur=Q[queue[0]];picked=new Set();answered=false;
  const h=hist[cur.id];
  card.innerHTML=`<div class="meta"><span class="tag">W${cur.w}</span><span class="tag">${TYPE[cur.type]}</span>${again.has(cur.id)?'<span class="tag again">再来一次</span>':""}${h?`<span>做过 ${h.seen} 次 · 错 ${h.wrong} 次</span>`:""}</div>
  <div class="q">${esc(cur.q)}</div>
  <div class="opts">${cur.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${cur.type==="tf"?(i?"F":"T"):L[i]}</span><span class="t">${esc(o)}</span></button>`).join("")}</div>
  <div id="fb"></div>
  <div class="actions">${cur.type==="ma"?'<button class="btn" id="submit">提交</button>':""}</div>`;
  card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  const s=document.getElementById("submit");if(s)s.onclick=submit;
  renderMath(card);
}
function choose(i){
  if(answered||!cur)return;
  if(cur.type==="ma"){picked.has(i)?picked.delete(i):picked.add(i);document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("picked",picked.has(+b.dataset.i)));return}
  picked=new Set([i]);submit();
}
function submit(){
  if(answered||!cur||!picked.size)return;answered=true;
  const ok=cur.ans.length===picked.size&&cur.ans.every(a=>picked.has(a));
  const h=hist[cur.id]||{seen:0,wrong:0,streak:0};h.seen++;
  if(ok){h.streak++}else{h.wrong++;h.streak=0}
  hist[cur.id]=h;store.set("csc311-hist",hist);
  document.querySelectorAll(".opt").forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.remove("picked");
    if(cur.ans.includes(i))b.classList.add("right");else if(picked.has(i))b.classList.add("wrong")});
  const id=queue.shift();
  if(ok){doneCount++;again.delete(id)}else{again.add(id);queue.splice(Math.min(3,queue.length),0,id)}
  const fb=document.getElementById("fb");
  fb.innerHTML=`<div class="verdict ${ok?"ok":"no"}">${ok?"答对了":"答错了，几题后再来"}</div><div class="ex"><b>${esc(cur.title)}</b>${esc(cur.ex)}</div>`;
  renderMath(fb);
  document.querySelector(".actions").innerHTML='<button class="btn" id="nx">下一题</button>';
  const nx=document.getElementById("nx");nx.onclick=next;nx.focus();stats();
}
document.addEventListener("keydown",e=>{
  if(!cur)return;
  if(e.key==="Enter"){e.preventDefault();answered?next():submit();return}
  const n=parseInt(e.key,10);if(n>=1&&n<=cur.opts.length&&!answered)choose(n-1);
});
buildWeeks();start();
</script>
